<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selected Work — planet to case study</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; }
  body {
    font-family: ui-monospace, "SF Mono", Menlo, monospace; color:#cfcabf; -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(120% 90% at 12% 28%, rgba(184,137,43,.30), transparent 45%),
      radial-gradient(90% 80% at 42% 80%, rgba(46,120,120,.20), transparent 55%),
      radial-gradient(100% 100% at 88% 45%, rgba(28,44,66,.30), transparent 60%),
      radial-gradient(140% 120% at 50% 50%, transparent 38%, rgba(0,0,0,.55)),
      #0a0b0d;
  }
  #app { position:fixed; inset:0; }
  canvas { display:block; }

  .hud { position:fixed; pointer-events:none; letter-spacing:.16em; font-size:12px; color:#8a857a; transition:opacity .3s; }
  .tl { top:26px; left:30px; } .tl b { color:#d8d2c6; font-weight:600; }
  .tr { top:26px; right:30px; }
  .bc { bottom:26px; left:50%; transform:translateX(-50%); text-align:center; }

  .label { position:fixed; transform:translate(-50%,-50%); pointer-events:none; text-align:center;
    letter-spacing:.14em; font-size:11px; color:#b7b1a5; transition:opacity .3s, color .2s; white-space:nowrap; }
  .label .n { color:#7a756b; margin-right:7px; }
  .label.hot { color:#e7c987; }
  .label.soon { color:#5f5a51; }
  .label .soon-tag { color:#6a655c; border:1px solid rgba(255,255,255,.12); border-radius:2px; padding:1px 5px; margin-left:8px; font-size:9px; }

  #panel { position:fixed; top:0; right:0; height:100%; width:min(460px,86vw);
    padding:120px 44px 40px; overflow-y:auto; transform:translateX(105%);
    transition:transform .7s cubic-bezier(.16,1,.3,1), opacity .3s ease;
    background:linear-gradient(90deg, transparent, rgba(12,13,16,.74) 22%); }
  #panel.open { transform:translateX(0); }
  #panel .eyebrow { font-size:11px; letter-spacing:.24em; color:#8a857a; }
  #panel h2 { font-family:"Poppins",system-ui,sans-serif; font-weight:600; font-size:38px; color:#efe7d3;
    margin:14px 0 6px; letter-spacing:.01em; line-height:1; }
  #panel .tag { font-size:12px; color:#9c968b; letter-spacing:.04em; margin-bottom:26px; }
  #panel .row { border-top:1px solid rgba(255,255,255,.08); padding:16px 0; }
  #panel .row .k { font-size:10px; letter-spacing:.2em; color:#b8892b; margin-bottom:7px; }
  #panel .row .v { font-size:13.5px; line-height:1.65; color:#d5cfc3; letter-spacing:.01em; }
  #panel .stack { display:flex; flex-wrap:wrap; gap:7px; margin-top:2px; }
  #panel .stack span { font-size:11px; letter-spacing:.08em; color:#cbb98a; border:1px solid rgba(184,137,43,.35); border-radius:2px; padding:4px 9px; }
  #panel .live { display:inline-block; margin-top:8px; font-size:12px; letter-spacing:.14em; color:#e7c987; text-decoration:none; border-bottom:1px solid rgba(184,137,43,.5); padding-bottom:2px; }
  #panel .shown { font-size:12px; color:#8a857a; letter-spacing:.04em; margin-top:8px; }
  #panel .nav { display:flex; justify-content:space-between; margin-top:34px; padding-top:20px; border-top:1px solid rgba(255,255,255,.08); }
  #panel .nav button { background:none; border:none; color:#8a857a; font-family:inherit; font-size:11px; letter-spacing:.16em; cursor:pointer; transition:color .2s; }
  #panel .nav button:hover { color:#e7c987; }

  #back { position:fixed; top:26px; left:30px; z-index:5; background:none; border:none; color:#8a857a;
    font-family:inherit; font-size:12px; letter-spacing:.16em; cursor:pointer; opacity:0; pointer-events:none; transition:opacity .4s, color .2s; }
  #back.on { opacity:1; pointer-events:auto; }
  #back:hover { color:#e7c987; }

  #flash { position:fixed; inset:0; pointer-events:none; opacity:0; background:radial-gradient(circle at center, rgba(231,201,135,.28), transparent 55%); }
</style>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">
</head>
<body>
<div id="app"></div>
<div id="flash"></div>

<div class="hud tl">// <b>SELECTED WORK</b> · 05 LIVE · 02 INCOMING</div>
<div class="hud tr" id="sys-hint">SELECT A PLANET</div>
<div class="hud bc" id="drift">DRAG TO LOOK AROUND · CLICK A PLANET TO OPEN IT</div>

<button id="back">← BACK TO THE SYSTEM</button>

<div id="panel">
  <div class="eyebrow" id="p-eyebrow">// PROJECT 01</div>
  <h2 id="p-name">—</h2>
  <div class="tag" id="p-tag">—</div>
  <div class="row"><div class="k">THE PROBLEM</div><div class="v" id="p-problem"></div></div>
  <div class="row"><div class="k">MY ROLE</div><div class="v" id="p-role"></div></div>
  <div class="row"><div class="k">WHAT I BUILT</div><div class="v" id="p-built"></div></div>
  <div class="row"><div class="k">STACK</div><div class="stack" id="p-stack"></div></div>
  <div class="row"><div class="k">RESULT</div><div class="v" id="p-result"></div><div id="p-link"></div></div>
  <div class="nav"><button id="prev">← PREV WORK</button><button id="next">NEXT WORK →</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const GOLD=0xb8892b, GOLD_HI=0xe0a838;

const PROJECTS = [
  { name:"AiCore", tag:"Forensic 3D reconstruction · Cre8tive Sync", size:1.25, band:1.1, home:[-4.6,1.3,-4],
    problem:"Forensic teams needed to rebuild a crime scene in 3D from ordinary photos — offline, and traceable enough to hold up in court.",
    role:"Frontend, and the interactive 3D model viewer.",
    built:"The viewer that loads the reconstruction and lets investigators move around it, inspect angles, and trace each step back to its source.",
    stack:["Frontend","3D viewer","Desktop / offline"],
    result:"In beta with forensic teams.", shown:"Shown via case study + a screen recording of the 3D viewer." },
  { name:"Oxilia", tag:"Internal SaaS workspace", size:1.15, band:0.7, home:[-2.3,-0.9,-3],
    problem:"A team was working across scattered tools with no shared home for their day-to-day.",
    role:"Full-stack.",
    built:"An internal workspace platform where the whole team manages their work in one place.",
    stack:["React","Node.js"],
    result:"Running as the team's internal workspace.", shown:"Shown via case study + screenshots (teammate info blurred)." },
  { name:"Gourmet Getaway Tours", tag:"Chef-led tour site · Australian client", size:1.05, band:1.4, home:[0,1.15,-5.5],
    problem:"A chef-led tour business needed a site that sells the experience, not just lists dates.",
    role:"Build — frontend.",
    built:"A tour website that presents the trips and lets people book and enquire.",
    stack:["TypeScript"],
    result:"Live for the client.", live:"#" },
  { name:"Tingi Station", tag:"Store redesign · Shopify", size:1.1, band:0.9, home:[2.4,-0.7,-3],
    problem:"An existing store needed a full refresh and new functionality.",
    role:"Full redesign + added functionality.",
    built:"A complete Shopify redesign with new features layered on top.",
    stack:["Shopify"],
    result:"Live.", live:"#" },
  { name:"MealPlanner", tag:"Nutrition app · capstone", size:1.0, band:1.2, home:[4.6,1.0,-4],
    problem:"Planning meals and tracking nutrition is fiddly to do on the go.",
    role:"Mobile app build (capstone).",
    built:"A mobile app that plans meals and tracks nutrition day to day.",
    stack:["React Native"],
    result:"Capstone project.", shown:"Shown via case study + visuals." },
  { name:"SocialHat", tag:"Agency frontend", size:0.95, band:1.0, home:[-3.3,-2.1,-6.5], soon:true },
  { name:"Kwento Kard", tag:"Gamified reading for young learners", size:0.95, band:1.3, home:[3.3,-2.2,-6.5], soon:true },
];

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.1, 120);
camera.position.set(0,0,6);
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setClearColor(0x000000,0);
renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.getElementById('app').appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x3a4048,0.75));
const key=new THREE.DirectionalLight(0xffffff,0.5); key.position.set(4,6,5); scene.add(key);
const gA=new THREE.PointLight(0xb8892b,1.0,60); gA.position.set(-8,3,5); scene.add(gA);
const gB=new THREE.PointLight(0x2f7d8c,0.8,60); gB.position.set(9,-3,-2); scene.add(gB);

const starMat = new THREE.PointsMaterial({color:0xffffff,size:0.09,transparent:true,opacity:0.55});
(function(){const geo=new THREE.BufferGeometry(),n=1000,p=new Float32Array(n*3);
  for(let i=0;i<n;i++){const r=18+Math.random()*40,a=Math.random()*6.28,b=Math.acos(2*Math.random()-1);
  p[i*3]=r*Math.sin(b)*Math.cos(a);p[i*3+1]=r*Math.sin(b)*Math.sin(a);p[i*3+2]=r*Math.cos(b);}
  geo.setAttribute('position',new THREE.BufferAttribute(p,3)); scene.add(new THREE.Points(geo,starMat)); })();

const V=(a)=>new THREE.Vector3(a[0],a[1],a[2]);
const planets = [];
PROJECTS.forEach((proj,i)=>{
  const grp = new THREE.Group();
  const base = proj.soon ? 0x232529 : 0x2b2e34;
  const globeMat = new THREE.MeshStandardMaterial({color:base, roughness:0.85, metalness:0.2, flatShading:true, transparent:true});
  const globe = new THREE.Mesh(new THREE.IcosahedronGeometry(proj.size, proj.soon?0:1), globeMat); grp.add(globe);
  const bandMat = new THREE.MeshStandardMaterial({color: proj.soon?0x4a4636:GOLD, roughness:0.5, metalness:0.6, emissive:GOLD, emissiveIntensity: proj.soon?0.04:0.16, transparent:true});
  const band = new THREE.Mesh(new THREE.TorusGeometry(proj.size*1.08, 0.045, 8, 44), bandMat); band.rotation.x=proj.band; band.rotation.y=i*0.5; grp.add(band);
  if(!proj.soon){
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,0.7,6), new THREE.MeshStandardMaterial({color:GOLD,metalness:0.6,roughness:0.4,transparent:true}));
    pole.position.set(proj.size*0.15, proj.size+0.35, 0); grp.add(pole);
    const flag = new THREE.Mesh(new THREE.BoxGeometry(0.38,0.24,0.02), new THREE.MeshStandardMaterial({color:GOLD_HI,metalness:0.6,roughness:0.35,emissive:GOLD,emissiveIntensity:0.25,transparent:true}));
    flag.position.set(proj.size*0.15+0.2, proj.size+0.55, 0); grp.add(flag);
  }
  grp.add(new THREE.PointLight(proj.soon?0x2f7d8c:0xb8892b, proj.soon?0.25:0.6, 6));
  grp.position.copy(V(proj.home));
  grp.userData = { proj, i, globe, home:V(proj.home).clone(), spin:0.002+Math.random()*0.004, materials:[] };
  grp.traverse(o=>{ if(o.isMesh && o.material) grp.userData.materials.push(o.material); });
  scene.add(grp); planets.push(grp);

  const el = document.createElement('div');
  el.className = 'label' + (proj.soon?' soon':'');
  el.innerHTML = `<span class="n">${String(i+1).padStart(2,'0')}</span>${proj.name}` + (proj.soon?`<span class="soon-tag">SOON</span>`:'');
  document.body.appendChild(el); grp.userData.label = el;
});

let state='system', selected=null, navBusy=false, tweens=[];
const now=()=>performance.now();
const easeOut=t=>1-Math.pow(1-t,3);
const easeInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function tween(dur,ease,on,done){ tweens.push({t0:now(),dur,ease,on,done}); }
function runTweens(){ for(let i=tweens.length-1;i>=0;i--){ const tw=tweens[i]; let p=(now()-tw.t0)/tw.dur; if(p>=1)p=1; tw.on(tw.ease(p)); if(p>=1){tweens.splice(i,1); tw.done&&tw.done();} } }

const STAGE=new THREE.Vector3(-2.5,0.2,2.0);
let warpP=0;
const flash=document.getElementById('flash'), panel=document.getElementById('panel');
function setOpacity(grp,o){ grp.userData.materials.forEach(m=>m.opacity=o); }

function setHint(){
  const drift=document.getElementById('drift'), sh=document.getElementById('sys-hint');
  if(state==='system'){ drift.textContent='DRAG TO LOOK AROUND · CLICK A PLANET TO OPEN IT'; drift.style.opacity=1; sh.style.opacity=1; }
  else { drift.textContent='DRAG TO INSPECT · SCROLL OR ← → TO MOVE · ESC TO GO BACK'; drift.style.opacity=1; sh.style.opacity=0; }
}

function fillPanel(proj,i){
  document.getElementById('p-eyebrow').textContent=`// PROJECT ${String(i+1).padStart(2,'0')}`;
  document.getElementById('p-name').textContent=proj.name;
  document.getElementById('p-tag').textContent=proj.tag;
  if(proj.soon){
    document.getElementById('p-problem').textContent="This one's still landing — the full write-up goes live once it's ready to show properly.";
    document.getElementById('p-role').textContent="—";
    document.getElementById('p-built').textContent="—";
    document.getElementById('p-stack').innerHTML=`<span>Coming soon</span>`;
    document.getElementById('p-result').textContent="Check back shortly.";
    document.getElementById('p-link').innerHTML="";
    document.getElementById('p-eyebrow').textContent=`// PROJECT ${String(i+1).padStart(2,'0')} · INCOMING`;
    return;
  }
  document.getElementById('p-problem').textContent=proj.problem;
  document.getElementById('p-role').textContent=proj.role;
  document.getElementById('p-built').textContent=proj.built;
  document.getElementById('p-stack').innerHTML=proj.stack.map(s=>`<span>${s}</span>`).join('');
  document.getElementById('p-result').textContent=proj.result;
  document.getElementById('p-link').innerHTML = proj.live ? `<a class="live" href="${proj.live}" target="_blank">VIEW LIVE ↗</a>`
    : (proj.shown ? `<div class="shown">${proj.shown}</div>` : '');
  panel.scrollTop=0;
}

function openPanel(){ panel.classList.add('open'); document.getElementById('back').classList.add('on'); }
function closePanel(){ panel.classList.remove('open'); document.getElementById('back').classList.remove('on'); }

// ---- select from system view ----
function select(grp){
  if(state!=='system') return;
  selected=grp; state='warping';
  document.getElementById('sys-hint').style.opacity=0; document.getElementById('drift').style.opacity=0;
  const y0=yaw,pi0=pitch;
  tween(600,easeInOut,p=>{ yaw=y0*(1-p); pitch=pi0*(1-p); });   // recenter camera
  tween(700,easeInOut,p=>{ warpP=Math.sin(p*Math.PI); flash.style.opacity=warpP*0.55; },()=>{warpP=0;flash.style.opacity=0;});
  planets.forEach(g=>{ if(g===grp) return; const s=g.position.clone(), d=s.clone().normalize().multiplyScalar(9);
    tween(600,easeOut,p=>{ g.position.lerpVectors(s,s.clone().add(d),p); setOpacity(g,1-p); }); });
  const s=grp.position.clone(), ss=grp.scale.x;
  tween(750,easeInOut,p=>{ grp.position.lerpVectors(s,STAGE,p); grp.scale.setScalar(ss+(1.7-ss)*p); },
    ()=>{ fillPanel(grp.userData.proj,grp.userData.i); openPanel(); state='detail'; setHint(); });
}

// ---- move between works while inside detail ----
function navTo(dir){
  if(state!=='detail'||navBusy) return; navBusy=true;
  const cur=selected, ti=(cur.userData.i+dir+planets.length)%planets.length, target=planets[ti];
  tween(500,easeInOut,p=>{ warpP=Math.sin(p*Math.PI)*0.6; flash.style.opacity=warpP*0.4; },()=>{warpP=0;flash.style.opacity=0;});
  panel.style.opacity='0';
  const cs=cur.position.clone(), css=cur.scale.x;
  tween(420,easeInOut,p=>{ cur.position.lerpVectors(cs, cs.clone().add(new THREE.Vector3(-dir*7,0,-2)),p); cur.scale.setScalar(css*(1-p)); setOpacity(cur,1-p); },
    ()=>{ cur.scale.setScalar(0.0001); });
  target.scale.setScalar(0.0001); setOpacity(target,1);
  const start=STAGE.clone().add(new THREE.Vector3(dir*7,0,-2)); target.position.copy(start);
  setTimeout(()=>{ fillPanel(target.userData.proj,target.userData.i); panel.style.opacity='1'; },260);
  tween(520,easeInOut,p=>{ target.position.lerpVectors(start,STAGE,p); target.scale.setScalar(1.7*p); },
    ()=>{ selected=target; navBusy=false; });
}

// ---- back to system ----
function deselect(){
  if(state!=='detail') return; state='returning'; navBusy=true; closePanel();
  planets.forEach(g=>{ const home=g.userData.home.clone(), sp=g.position.clone(), ss=g.scale.x, so=g.userData.materials[0].opacity;
    tween(700,easeInOut,p=>{ g.position.lerpVectors(sp,home,p); g.scale.setScalar(ss+(1-ss)*p); setOpacity(g, so+(1-so)*p); }); });
  setTimeout(()=>{ state='system'; selected=null; navBusy=false; setHint(); },720);
}
document.getElementById('back').onclick=deselect;
document.getElementById('prev').onclick=()=>navTo(-1);
document.getElementById('next').onclick=()=>navTo(1);
addEventListener('keydown',e=>{ if(state==='detail'){ if(e.key==='ArrowRight')navTo(1); else if(e.key==='ArrowLeft')navTo(-1); else if(e.key==='Escape')deselect(); } });

// scroll: let the panel scroll if it can, otherwise move between works
let wheelLock=false;
addEventListener('wheel',e=>{
  if(state!=='detail') return;
  const canScroll = panel.scrollHeight > panel.clientHeight+4;
  if(canScroll){ const atBottom=panel.scrollTop+panel.clientHeight>=panel.scrollHeight-2, atTop=panel.scrollTop<=2;
    if((e.deltaY>0&&!atBottom)||(e.deltaY<0&&!atTop)) return; }
  if(wheelLock) return; wheelLock=true; setTimeout(()=>wheelLock=false,750);
  navTo(e.deltaY>0?1:-1);
},{passive:true});

// ---- pointer: hover, click, drag (orbit in system / inspect planet in detail) ----
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2();
let hover=null, dragging=false, lastX=0, lastY=0, yaw=0, pitch=0;
function pick(x,y){ mouse.x=(x/innerWidth)*2-1; mouse.y=-(y/innerHeight)*2+1; ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(planets.map(g=>g.userData.globe)); return hits[0]?hits[0].object.parent:null; }

renderer.domElement.addEventListener('pointerdown',e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY;
  if(state==='detail') renderer.domElement.style.cursor='grabbing'; });
addEventListener('pointerup',e=>{
  if(dragging && Math.abs(e.clientX-lastX)<4 && Math.abs(e.clientY-lastY)<4 && state==='system'){ const g=pick(e.clientX,e.clientY); if(g)select(g); }
  dragging=false; if(state==='detail') renderer.domElement.style.cursor='grab';
});
addEventListener('pointermove',e=>{
  const dx=e.clientX-lastX, dy=e.clientY-lastY;
  if(dragging && state==='system'){ yaw+=dx*0.0016; pitch+=dy*0.0012; pitch=Math.max(-0.4,Math.min(0.4,pitch)); lastX=e.clientX; lastY=e.clientY; }
  else if(dragging && state==='detail' && selected){ selected.rotation.y+=dx*0.01; selected.rotation.x=Math.max(-0.6,Math.min(0.6,selected.rotation.x+dy*0.008)); lastX=e.clientX; lastY=e.clientY; }
  if(state==='system'){ const g=pick(e.clientX,e.clientY);
    if(g!==hover){ if(hover)hover.userData.label.classList.remove('hot'); hover=g;
      if(hover&&!hover.userData.proj.soon)hover.userData.label.classList.add('hot');
      renderer.domElement.style.cursor=hover?'pointer':'default'; } }
});

// ---- animate ----
const pv=new THREE.Vector3();
function animate(){
  requestAnimationFrame(animate); runTweens();
  starMat.size=0.09+warpP*0.6; starMat.opacity=0.55+warpP*0.4;
  const d=6;
  camera.position.x += (Math.sin(yaw)*d - camera.position.x)*0.06;
  camera.position.z += (Math.cos(yaw)*d - camera.position.z)*0.06;
  camera.position.y += (pitch*4 - camera.position.y)*0.06;
  camera.lookAt(0,0,-2);
  planets.forEach(g=>{ g.children[0].rotation.y += g.userData.spin;
    const el=g.userData.label;
    if(state==='system'){ pv.copy(g.position); pv.y+=g.userData.proj.size+0.9; pv.project(camera);
      el.style.display = pv.z<1?'block':'none';
      el.style.left=((pv.x*0.5+0.5)*innerWidth)+'px'; el.style.top=((-pv.y*0.5+0.5)*innerHeight)+'px';
    } else el.style.display='none';
  });
  renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
